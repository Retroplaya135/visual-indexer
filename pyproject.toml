[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "visual-indexer"
version = "0.1.0"
description = "Authorized, robots-aware visual reference indexing"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.scripts]
visual-indexer = "visual_indexer.main:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
visual_indexer = ["site_configs/*.json", "fixtures/synthetic-site/*.html"]
